spring.application.name=backend
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chollae?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

book.import.enabled=${BOOK_IMPORT_ENABLED:false}
book.import.path=${BOOK_IMPORT_PATH:}
book.import.limit=${BOOK_IMPORT_LIMIT:5000}
book.import.batch-size=${BOOK_IMPORT_BATCH_SIZE:500}
book.import.library-name=${BOOK_IMPORT_LIBRARY_NAME:사당솔밭도서관}
