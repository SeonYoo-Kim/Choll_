spring.application.name=backend
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chollae?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

springdoc.paths-to-match=/api/carts/**,/api/maps/**

mqtt.enabled=${MQTT_ENABLED:false}
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
# 브로커 인증 (배포 환경 필수, 로컬 무인증 브로커면 비워둠)
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.client-id=${MQTT_CLIENT_ID:chollae-backend}
mqtt.position-topic=${MQTT_POSITION_TOPIC:carts/+/telemetry/position}
mqtt.status-topic=${MQTT_STATUS_TOPIC:carts/status}
mqtt.rfid-topic=${MQTT_RFID_TOPIC:choll/cart/rfid}
mqtt.tracks-topic=${MQTT_TRACKS_TOPIC:choll/cart/tracks}
# BE->EM 명령 토픽 (EM 미확정 임시값)
mqtt.command-topic=${MQTT_COMMAND_TOPIC:choll/cart/cmd}
# 하트비트·RFID 토픽에 cartId가 없어(EM 계약, 단일 카트) 이벤트를 귀속할 카트를 지정
mqtt.cart-id=${MQTT_CART_ID:1}
mqtt.qos=${MQTT_QOS:0}

book.import.enabled=${BOOK_IMPORT_ENABLED:false}
book.import.path=${BOOK_IMPORT_PATH:}
book.import.limit=${BOOK_IMPORT_LIMIT:5000}
book.import.batch-size=${BOOK_IMPORT_BATCH_SIZE:500}
book.import.library-name=${BOOK_IMPORT_LIBRARY_NAME:사당솔밭도서관}

# 카트 연결 판정: 하트비트/텔레메트리가 timeout 이상 끊기면 워치독이 OFFLINE 전환
cart.connection.offline-timeout-seconds=${CART_OFFLINE_TIMEOUT_SECONDS:15}
cart.connection.watchdog-interval-ms=${CART_WATCHDOG_INTERVAL_MS:5000}

# FE-BE WebSocket 연결 확인용 임시 위치 발행기 (1초 간격)
# 실제 MQTT 위치가 WS로 중계되므로 기본 off — 브로커 없이 FE만 확인할 때 true로
websocket.position-test.enabled=${WS_POSITION_TEST_ENABLED:false}
websocket.position-test.cart-id=${WS_POSITION_TEST_CART_ID:1}
websocket.position-test.map-id=${WS_POSITION_TEST_MAP_ID:2}
