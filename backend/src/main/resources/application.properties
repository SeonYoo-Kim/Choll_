spring.application.name=backend
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chollae?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

springdoc.paths-to-match=/api/carts/**,/api/maps/**

mqtt.enabled=${MQTT_ENABLED:false}
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:chollae-backend}
mqtt.position-topic=${MQTT_POSITION_TOPIC:carts/+/telemetry/position}
mqtt.qos=${MQTT_QOS:0}

book.import.enabled=${BOOK_IMPORT_ENABLED:false}
book.import.path=${BOOK_IMPORT_PATH:}
book.import.limit=${BOOK_IMPORT_LIMIT:5000}
book.import.batch-size=${BOOK_IMPORT_BATCH_SIZE:500}
book.import.library-name=${BOOK_IMPORT_LIBRARY_NAME:사당솔밭도서관}

# FE-BE WebSocket 연결 확인용 임시 위치 발행기 (1초 간격)
websocket.position-test.enabled=${WS_POSITION_TEST_ENABLED:true}
websocket.position-test.cart-id=${WS_POSITION_TEST_CART_ID:1}
websocket.position-test.map-id=${WS_POSITION_TEST_MAP_ID:2}
