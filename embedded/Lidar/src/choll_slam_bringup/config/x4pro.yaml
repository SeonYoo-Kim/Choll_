# =============================================================
# YDLIDAR X4 Pro 파라미터 — ydlidar_ros2_driver 용
# 파라미터 키 이름은 공식 repo(params/ydlidar.yaml, humble 브랜치)에서 검증함.
# 값의 근거는 X4PRO Datasheet / User Manual / Development Manual:
#   - Baud 128000 bps, 8N1                     (Datasheet Chart 4)
#   - 측정범위 0.12 ~ 10 m (실내 80% 반사율)     (Datasheet Chart 1)
#   - 스캔주파수 6~12 Hz, 샘플링 5 kHz           (Datasheet Chart 1)
#   - 통신은 Tx 단방향(장비→호스트)              (User Manual 2.4)
#     → 싱글채널 라이다: isSingleChannel: true
#   - 삼각측량(Triangle) 방식                    (Datasheet 1 Overview)
#   - 모터 드라이브/despin 내장, 전원 인가 시 자동 회전 (Dev Manual 1)
# =============================================================
ydlidar_ros2_driver_node:
  ros__parameters:
    # ---- 연결 ----
    # TODO(확인 필요): Jetson에서 `ls -l /dev/ttyUSB*`로 실제 포트 확인.
    # 드라이버 repo의 startup/initenv.sh 적용 시 고정 별칭 /dev/ydlidar 사용 가능.
    port: /dev/ttyUSB0
    frame_id: laser_frame
    baudrate: 128000          # X4Pro 고정값. 다른 값이면 데이터 파싱 불가
    lidar_type: 1             # 1 = TYPE_TRIANGLE (삼각측량)
    device_type: 0            # 0 = 시리얼(UART/USB어댑터) 연결
    auto_reconnect: true

    # ---- X4Pro 채널/모터 특성 ----
    isSingleChannel: true     # Tx 단방향 → 싱글채널 (User Manual 2.4)
    support_motor_dtr: false  # 모터드라이브 내장이라 기본 false.
                              # 만약 모터가 회전하지 않으면 true로 바꿔 재시도 (어댑터보드 DTR despin 제어)
    intensity: false
    intensity_bit: 0

    # ---- 샘플링/해상도 ----
    sample_rate: 5            # 5 kHz (Datasheet: Ranging frequency 5000 Hz)
    fixed_resolution: true
    frequency: 10.0           # 참고: 싱글채널이라 시리얼로 회전속도 제어 불가.
                              # 실제 회전수는 라이다 자체(M_CTR)로 결정됨 (6~12Hz)
    abnormal_check_count: 4

    # ---- 좌표/방향 ----
    # 지도가 좌우 반전이면 inverted, 전/후가 뒤집혀 보이면 reversion을 토글해서 실측 확인
    #
    # 🔴 2026-08-09 손회전 실측: 카트를 손으로 CCW 45~90도 돌렸을 때
    #    /wheel/odom yaw +69.04deg (정상) 인데 /odom_rf2o yaw -61.66deg (반대) 였다.
    #    크기는 맞고 부호만 반대 = 스케일이 아니라 **거울 반사**. 회전(reversion)으로는
    #    각속도 부호가 뒤집히지 않으므로 각도 방향을 반전하는 inverted 를 true 로 시험한다.
    #    (미러된 스캔은 그 스캔으로 만든 지도와는 자기정합적이라 정지 scan_fit 은 높게
    #     나온다 — 회전할 때만 드러난다.)
    #    ⚠️ true 로 확정되면 기존 map_home / map_home_v2 는 모두 재매핑 대상이다.
    reversion: false
    inverted: true

    # ---- 범위 (Datasheet Chart 1) ----
    angle_max: 180.0
    angle_min: -180.0
    range_max: 10.0
    range_min: 0.12

    # ---- 시야 마스킹 ----
    # 🔴 여기서 마스킹하지 않는다 (2026-08-07 실측 결정). 반드시 빈 문자열 유지.
    #
    # 자기차폐 구간은 scripts/scan_mask_node.py 가 /scan_raw -> /scan 단계에서
    # 각도로 마스킹한다. 이유:
    #   드라이버 ignore_array로 자르면 스캔의 19.9%가 무효가 되고 rf2o가 range
    #   이미지 경계에서 허위 gradient를 만들어 **정지 상태에서 -0.4 deg/s**
    #   드리프트를 낸다 (yaw 30초에 -12deg, S2_drift.log). 마스킹을 끄면 같은
    #   조건에서 yaw가 -6.1~-7.7deg 사이 진동만 하고 누적되지 않으며
    #   map->base 가 odom->base 와 완전히 일치한다 (S2_drift_nomask.log).
    #   → rf2o는 원본(/scan_raw), 나머지 소비자는 마스킹된 /scan 을 쓴다.
    # 실측 섹터 목록·근거는 scan_mask_node.py 의 DEFAULT_MASK_DEG 주석 참조.
    ignore_array: ""

    # 2026-08-07 실험 결과: true로 바꿔도 마스킹 빔은 여전히 0.0으로 나온다
    #   (SDK가 range=0.0을 직접 박고 드라이버의 inf 변환은 거기에 적용되지 않음).
    #   즉 이 값으로는 위 드리프트를 해결할 수 없음이 확인됨 → 원래 값 유지.
    invalid_range_is_inf: false
    debug: false
