# =============================================================
# YDLIDAR X4 Pro 파라미터 — ydlidar_ros2_driver 용
# 파라미터 키 이름은 공식 repo(params/ydlidar.yaml, humble 브랜치)에서 검증함.
# 값의 근거는 X4PRO Datasheet / User Manual / Development Manual:
#   - Baud 128000 bps, 8N1                     (Datasheet Chart 4)
#   - 측정범위 0.12 ~ 10 m (실내 80% 반사율)     (Datasheet Chart 1)
#   - 스캔주파수 6~12 Hz, 샘플링 5 kHz           (Datasheet Chart 1)
#   - 통신은 Tx 단방향(장비→호스트)              (User Manual 2.4)
#     → 싱글채널 라이다: isSingleChannel: true
#   - 삼각측량(Triangle) 방식                    (Datasheet 1 Overview)
#   - 모터 드라이브/despin 내장, 전원 인가 시 자동 회전 (Dev Manual 1)
# =============================================================
ydlidar_ros2_driver_node:
  ros__parameters:
    # ---- 연결 ----
    # TODO(확인 필요): Jetson에서 `ls -l /dev/ttyUSB*`로 실제 포트 확인.
    # 드라이버 repo의 startup/initenv.sh 적용 시 고정 별칭 /dev/ydlidar 사용 가능.
    port: /dev/ttyUSB0
    frame_id: laser_frame
    baudrate: 128000          # X4Pro 고정값. 다른 값이면 데이터 파싱 불가
    lidar_type: 1             # 1 = TYPE_TRIANGLE (삼각측량)
    device_type: 0            # 0 = 시리얼(UART/USB어댑터) 연결
    auto_reconnect: true

    # ---- X4Pro 채널/모터 특성 ----
    isSingleChannel: true     # Tx 단방향 → 싱글채널 (User Manual 2.4)
    support_motor_dtr: false  # 모터드라이브 내장이라 기본 false.
                              # 만약 모터가 회전하지 않으면 true로 바꿔 재시도 (어댑터보드 DTR despin 제어)
    intensity: false
    intensity_bit: 0

    # ---- 샘플링/해상도 ----
    sample_rate: 5            # 5 kHz (Datasheet: Ranging frequency 5000 Hz)
    fixed_resolution: true
    frequency: 10.0           # 참고: 싱글채널이라 시리얼로 회전속도 제어 불가.
                              # 실제 회전수는 라이다 자체(M_CTR)로 결정됨 (6~12Hz)
    abnormal_check_count: 4

    # ---- 좌표/방향 ----
    # 지도가 좌우 반전이면 inverted, 전/후가 뒤집혀 보이면 reversion을 토글해서 실측 확인
    reversion: false
    inverted: false

    # ---- 범위 (Datasheet Chart 1) ----
    angle_max: 180.0
    angle_min: -180.0
    range_max: 10.0
    range_min: 0.12

    # ---- 시야 마스킹 ----
    # 카트 자기차폐(프레임 기둥·선반·뒤 손잡이) 구간 제외.
    # 형식: "시작각1,끝각1,시작각2,끝각2,..." (도 단위, 쌍 개수 제한 없음 —
    #   SDK가 m_IgnoreArray를 쌍 단위로 순회하며 해당 구간 range=0.0으로 만듦)
    #
    # 2026-08-07 실측 확정 (선반 카트 조립 후 재측정, PHASE3_QUICKSTART §1):
    #   구 값 "-78,-70,72,79"(08-05 오링카 기준)은 조립 후 기하와 어긋나
    #   빈 공간을 가리고 기둥은 통과시켰다 → 전면 재산정.
    #   측정: 200스캔(18초)을 4구간으로 쪼개 시간 지속성 확인 + 10분 간격
    #   2회 측정 교차검증 → 아래 9개 구간이 두 측정·4구간 모두에서 불변
    #   = 통행인이 아니라 카트 구조물 (0.12~0.18 m는 사람이 설 수 없는 거리).
    #     -179..-173° 0.454 m | -161..-160° 0.121 | -157..-148° 0.128
    #     -138°       0.185   |  -88..-86°  0.170 |  -81..-77°  0.131 (좌 기둥2)
    #     +79..+80°   0.141 (우 기둥2) | +165..+167° 0.185 | +178..+180° 0.459
    #   1차 반영 후 재검증에서 구 마스킹에 가려져 있던 2쌍이 추가로 드러났다
    #   (좌우 대칭 → 기둥이 각 측 2개):
    #     -74..-73° 0.136 m (좌 기둥1) | +73..+74° 0.143 (우 기둥1)
    #   → 좌 -90..-71, 우 71..82로 확대해 기둥1·2를 모두 덮는다.
    #   여유각 ±2°: fixed_resolution=true라 드라이버가 원시 빔을 430~440빈으로
    #     리샘플링하는데 SDK는 리샘플링 전 각도로 마스킹 → 경계에서 최대
    #     ±1빔(0.82°) 누출. 구 값에서 -77.49°/+79.13°가 살아남은 원인.
    #   총 마스킹 71.6° (19.9%). AI 조회창(실측 화각 40.1° → ±20°) 침범 0
    #   — 재검증 시 ±20° 유효율 95.8%, 거리 2.72~3.10 m.
    # ⚠️ 마스킹은 필수: 0.12 m 포인트는 base_link 기준 footprint 안쪽이라
    #   그대로 매핑하면 Nav2 local costmap이 로봇을 상시 장애물로 둘러싸
    #   모든 경로 계획이 실패한다.
    ignore_array: "-180,-171,-163,-146,-140,-136,-90,-71,71,82,163,169,176,180"

    invalid_range_is_inf: false
    debug: false
