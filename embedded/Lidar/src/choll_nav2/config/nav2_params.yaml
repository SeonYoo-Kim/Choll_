# 쫄래쫄래 카트 Nav2 파라미터 (ROS2 Humble)
#
# 기반: nav2_bringup 기본 파라미터 구조 + turtlebot3_navigation2(burger) 값 참조.
# 카트 특성 반영: 차동구동, 직사각 footprint(전후 0.62 x 좌우 0.32 실측 2026-08-08),
# YDLIDAR X4 Pro(~7Hz, 0.12~10m, BestEffort QoS — Humble costmap은 기본이
# 센서 QoS라 추가 설정 불필요),
# 오도메트리는 임시로 rf2o(/odom_rf2o, 10Hz). STM32에는 속도 클램프가 없으므로
# velocity_smoother가 ROS 쪽 유일한 클램프다 — 값 변경 시 주의.
#
# 🔴 2026-08-10 — 속도 상한은 이 파일이 최종 권위가 **아니다.**
#   `choll_nav2/launch/nav.launch.py` 가 RewrittenYaml 로 아래 값들을 덮어쓴다
#   (기본 linear 0.45 m/s / angular 0.4 rad/s. 정본 = 그 파일의 DEFAULT_MAX_*_VEL):
#
#     controller_server.FollowPath.max_vel_x / max_speed_xy / max_vel_theta
#     velocity_smoother.max_velocity[x] / max_velocity[theta] / min_velocity[theta]
#     behavior_server.max_rotational_vel
#
#   여기 남아 있는 숫자는 **런치를 우회해 이 yaml 을 직접 먹였을 때의 안전한
#   폴백**이다(느린 쪽). 실주행 값을 바꾸려면 `choll-up --linear/--angular` 또는
#   nav.launch.py 의 기본 상수를 고칠 것 — 이 파일을 고쳐도 런치가 덮어쓴다.
#   덮어쓰지 **않는** 것: acc_lim_* / max_accel / max_decel / min_vel_x /
#   min_velocity[x] / min_rotational_vel — 이 값들은 여기가 정본이다.
#
# ⚠ TODO-실측/팀확인 표기가 있는 값은 임의 확정 금지 (CLAUDE.md 규칙):
#   - footprint: 2026-08-08 실측 반영 완료 (전후 0.62 / 바퀴 바깥면 0.44). 모순 해소
#   - acc_lim: STM32 램프 4 rad/s²의 기준 축(바퀴/차체) 미확정 → 보수값 사용
#   - inflation_radius: 2026-08-08 실측 여유(최대 0.75m) 기준 0.25/0.30 으로 조정

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0     # X4 Pro 최대 거리
    laser_min_range: 0.12     # X4 Pro 최소 거리
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom_rf2o    # /odom은 향후 STM32 휠 오도메트리용 예약
    bt_loop_duration: 10
    default_server_timeout: 20
    # plugin_lib_names는 Humble 기본값 사용 (표준 BT 노드 전체 포함)
    # 플레이스홀더 — nav.launch.py가 RewrittenYaml로 BackUp 제거 BT
    # (behavior_trees/navigate_to_pose_no_backup.xml) 절대경로를 주입
    default_nav_to_pose_bt_xml: ""

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

  # 2026-08-07 실측 변경: 회전 0.6 rad/s는 바퀴 1.754 rad/s = PWM 17로
  #   Phase 1 실측 데드존(PWM 20) 미만이라 카트가 아예 회전하지 않았다.
  #   Nav2가 '목표 방향 회전' 단계를 못 끝내고 150초간 NAVIGATING에 갇힘
  #   (tests/TEST_LOG.md). 회전 2배·직진 절반으로 재배분한다.
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0     # STM32가 20Hz 이상 연속 수신 요구
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    # 🔴 2026-08-09 변경: /odom_rf2o -> /odometry/filtered.
    #    DWB 는 이 토픽의 twist 를 궤적 생성의 현재 속도로 쓴다. raw rf2o 는 정지
    #    상태에서도 angular.z std 0.0346 rad/s (평균의 100배) 로 요동쳐 기준점이
    #    흔들렸다. EKF+ZUPT 를 거친 /odometry/filtered 는 같은 조건에서
    #    std 0.000105 로 약 330배 안정적이다 (2026-08-09 8분 정지 실측).
    odom_topic: /odometry/filtered
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3   # 느린 대형 카트 기준 (TB3: 0.5/10s)
      movement_time_allowance: 30.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35    # 북카트 용도상 타이트할 필요 없음. TODO-팀확인
      yaw_goal_tolerance: 0.785  # 45° — 제자리 회전 최소화 (STM32 방향전환 홀드)
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      # trajectory_generator_name 은 지정하지 않는다 = DWB 기본
      # StandardTrajectoryGenerator.
      # 🔴 2026-08-09 A/B 시험 결과 `dwb_plugins::LimitedAccelGenerator` 는
      #    **이 플랜트에서 쓸 수 없다.** 그 생성기는 현재 속도에서
      #    acc_lim x sim_period(=1/controller_frequency=0.05s) 만큼만 샘플링하는데,
      #    theta 는 1.6*0.05 = 0.08 rad/s (바퀴 0.23) 로 모터 데드존(바퀴 약 0.7)
      #    아래다. 바퀴가 안 도니 측정 속도가 0에 머물고 샘플 창도 안 커져
      #    **출발 자체를 못 했다** (실측: |wz| 98.4% 가 0.2 미만, 0.2~1.0 구간 0개).
      #    선형축도 0.3*0.05 = 0.015 m/s 로 같은 문제다.
      #    되살리려면 데드존 보상이 먼저다 — sim_period 를 임의로 키우지 말 것.
      debug_trajectory_details: True
      min_vel_x: 0.0             # 후진 금지 (후방 미검증 + 방향전환 홀드 회피)
      min_vel_y: 0.0
      max_vel_x: 0.15   # 2026-08-07 0.3 -> 0.15 (회전 확보를 위해 절반)
      max_vel_y: 0.0
      max_vel_theta: 1.2    # 2026-08-07 0.6 -> 1.2 (PWM 17 데드존 탈출, 바퀴 3.51)
      min_speed_xy: 0.0
      max_speed_xy: 0.15
      min_speed_theta: 0.0
      acc_lim_x: 0.3             # TODO-팀확인: STM32 램프 4rad/s² 기준 축 미확정
      acc_lim_y: 0.0
      acc_lim_theta: 1.6    # 2026-08-07 데드존 구간을 빠르게 통과
      decel_lim_x: -0.3
      decel_lim_y: 0.0
      decel_lim_theta: -1.6
      vx_samples: 20
      vy_samples: 0
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5   # rf2o 10Hz TF 지연 대응 (TB3 0.2 → 완화)
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics:
        [
          "RotateToGoal",
          "Oscillation",
          "ObstacleFootprint",
          "GoalAlign",
          "PathAlign",
          "PathDist",
          "GoalDist",
        ]
      # 🔴 2026-08-09 BaseObstacle -> ObstacleFootprint 교체.
      #    BaseObstacleCritic 은 Humble 헤더 원문대로 "can only be used to figure out
      #    if a **circular** robot is in collision" — 궤적 각 pose 의 **중심 셀 1개**만
      #    본다. 우리 카트는 원형도 아니고 base_link 가 차체 중심도 아닌
      #    비대칭 직사각형(앞 +0.10 / 뒤 -0.50)이라 중심 셀이 깨끗해도 후방 모서리
      #    (외접반지름 0.546 m)가 벽 안에 들어가 있을 수 있다.
      #    ObstacleFootprintCritic 은 getOrientedFootprint() 로 자세에 맞춰 회전시킨
      #    실제 폴리곤 **외곽선을 래스터라이즈**해 검사한다.
      #    ⚠️ scale 은 A/B 최소 변경 원칙으로 기존 BaseObstacle 과 동일한 0.02 로 시작.
      #    (ObstacleFootprintCritic::getScale() 이 resolution 을 한 번 더 곱하므로
      #     같은 0.02 라도 실효 가중치는 BaseObstacle 과 다르다 — 실주행 후 재조정.)
      #
      # 2026-08-09 0.02 -> 0.20 A/B 시험 완료 — **효과 없어 0.02 로 복원.**
      #    두 주행 모두 SUCCEEDED·충돌 0·rejection 0 이었고 여유는 0.051 -> 0.059 m.
      #    다만 두 시험의 **경로가 달라 통제된 비교가 아니며** 8 mm 는 개선의 증거가
      #    못 된다. 기전상으로도 무력하다: `getScale()` 이 resolution(0.05)을 곱해
      #    실효 가중치가 0.01 이라 PathAlign/PathDist(32.0) 의 3000분의 1이다.
      #    rejection 이 두 번 다 0 이었다는 것은 이 critic 이 연속적인 척력이 아니라
      #    **lethal 침범 시의 거부권으로만** 작동한다는 뜻이다 — scale 을 올려 여유를
      #    벌려면 path 추종 항과 겨룰 명목 수백대가 필요해 현실적이지 않다.
      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.325
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.325
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 4                   # 카트 크기 + 인플레이션이 3m 창에 안 들어감
      height: 4
      resolution: 0.05
      # 2026-08-08 실측 반영. 카트 본체 **전후 620 x 좌우 320 mm**,
      # 구동륜 트레드 중심선 간격 380 mm, 타이어 접지 폭 60 mm.
      # 🔴 이전 값 [±0.35, ±0.32](= 0.70 x 0.64)는 좌우를 2배로 잡고 있었다
      #    (사용자 표현 "가로/세로"를 좌우/전후로 뒤집어 해석한 것이 원인).
      #
      # 좌우 ±0.22 는 본체(±0.16)가 아니라 **바퀴 바깥면** 기준이다:
      #    바퀴 안쪽 = 0.19 - 0.03 = 0.16  (본체 반폭과 정확히 일치 → 바퀴가
      #                                     본체 옆면에 붙어 바깥으로 달린 구조)
      #    바퀴 바깥 = 0.19 + 0.03 = 0.22  → 카트 최대 폭 0.44 m
      # 이 계산으로 "wheel_separation 0.38 vs 본체 폭 0.32" 모순은 해소됐다.
      #
      # 🔴 2026-08-09 실측 정정 — **원점 위치가 틀려 있었다.**
      #    이전 값 [±0.31, ±0.22] 는 전후 길이(0.62)는 대략 맞았지만 base_link 를
      #    차체 기하 중심으로 **가정**해 앞뒤를 대칭으로 잡았다. 실제로는
      #    **전륜 구동**이라 base_link(= 좌우 구동륜 차축 정중앙) 가 차체 앞쪽에
      #    치우쳐 있다. 사용자 줄자 실측:
      #        base_link -> 최전방  +0.10   (이전 가정 +0.31 -> 0.21 m 과대)
      #        base_link -> 최후방  -0.50   (이전 가정 -0.31 -> 0.19 m 과소)
      #        base_link -> 좌/우   ±0.22   (변경 없음 — 바퀴 바깥면 기준)
      #    즉 카트 몸통의 대부분은 base_link **뒤쪽**에 있다. 이전 footprint 는
      #    존재하지 않는 전방 0.21 m 를 차지한다고 보고, 실재하는 후방 0.19 m 를
      #    비어 있다고 봤다. 후진 시 후방 충돌 · 제자리 회전 시 후미 스윙 충돌이
      #    설명된다.
      footprint: "[ [0.10, 0.22], [0.10, -0.22], [-0.50, -0.22], [-0.50, 0.22] ]"
      # 내접반지름 = 0.10 m (전방 한계, 이전 0.22). 원점이 앞쪽에 치우쳐 이 값이
      # 작아졌다 — 중심 셀 판정만으로는 차체를 못 지킨다. ObstacleFootprint critic 필수.
      # 외접반지름 = sqrt(0.50^2 + 0.22^2) = 0.546 m (후방 모서리).
      #
      # 🔴 2026-08-09 0.0 -> 0.05 (A/B 시험). 벽 여유를 **비용으로 유도**하는 방법
      #    (inflation_radius / cost_scaling_factor / ObstacleFootprint.scale)이 셋 다
      #    실패했으므로, 이번엔 안전거리를 **기하로 명시**한다. padding 은 위 polygon 을
      #    바깥으로 5 cm 부풀린 **가상 충돌 봉투**를 만들고 DWB/ObstacleFootprint 가
      #    그것으로 충돌을 판정하게 한다 — 가상 봉투가 벽에 닿는 순간 실제 차체는
      #    아직 5 cm 떨어져 있다.
      #    ⚠️ 이 값은 **local 에만** 준다. global 은 실제 기하를 유지해야 도달 가능성이
      #       줄지 않는다 (robot_radius 0.55 A/B 에서 확인된 교훈).
      #    ⚠️ `/local_costmap/published_footprint` 는 이제 **padded** 폴리곤이다.
      #       clearance 를 잴 때 그것을 실제 차체로 착각하면 안 된다.
      footprint_padding: 0.05
      transform_tolerance: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0   # 완만한 기울기 — 좁은 통로에서 경로 확보
        # 2026-08-08 실측으로 0.8 -> 0.25. inflation_radius 가 실제 통로 여유보다
        # 크면 자유 셀이 하나도 남지 않아 GridBased 가 경로를 못 만든다 — 집 환경
        # (최대 여유 0.75 m) 에서 "failed to create plan with tolerance 0.50" 로 재현됨.
        # 내접반지름(0.22)보다는 커야 inflation 이 의미가 있으므로 0.25 로 둔다.
        #
        # 🔴 2026-08-09 0.25 -> 0.60. footprint 정정으로 기준이 바뀌었다.
        #    내접 0.10 / **외접 0.546** (후방 모서리). 0.25 는 외접의 절반도 안 돼
        #    차체의 가장 먼 부분이 포텐셜 필드 **밖**에 있었다 — 벽에서 0.26 m 만
        #    벗어나면 cost 가 0 이라 경로가 벽에 붙을 이유도 떨어질 이유도 없었다.
        #    0.60 은 외접 0.546 을 막 넘기는 값이다.
        #    ⚠️ inflation_radius 는 "주행 금지 반경"이 아니다. `computeCost()` 상
        #    내접(0.10) 이내만 253(INSCRIBED)이고 그 밖은 전부 252 이하의 **gradient**
        #    라 통과 가능하다. 즉 이 값을 키워도 lethal 셀은 하나도 늘지 않는다
        #    (위 08-08 주석의 "자유 셀이 사라진다" 는 내접반지름이 0.22 이던 시절의
        #     이야기다 — 지금은 내접이 0.10 이라 같은 문제가 재현되지 않는다).
        inflation_radius: 0.60
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      # local_costmap과 동일 값 유지 (근거는 local_costmap 쪽 주석).
      # 🔴 2026-08-09 실측 정정: base_link 는 차체 중심이 아니라 **전륜 차축 중심**.
      #    앞 +0.10 / 뒤 -0.50 (좌우 ±0.22 는 그대로). local 과 반드시 같아야 한다.
      #
      # 2026-08-09 A/B 시험 완료 — **보수적 원형(`robot_radius: 0.55`)은 채택하지 않았다.**
      #    동기는 타당했다: NavFn 은 점으로 계획해 내접(0.10)만 보장하는데 차체는 어느
      #    yaw 로도 외접 0.546 m 가 필요하다. 그래서 전역만 원형으로 두면 그 간극이
      #    사라진다. 그러나 이 집 지도에서는 **너무 보수적이었다** (주행 없이
      #    ComputePathToPose 로만 비교):
      #        A 넓은 공간(실제로 SUCCEEDED 했던 경로) : polygon 성공 -> **원형 실패**
      #        B 대표 free-space                      : 둘 다 성공 (중심여유 0.600 -> 0.605)
      #        C 좁은 통로                            : polygon 성공 -> 원형 실패
      #    실제로 완주한 경로마저 계획 불가가 되므로 되돌린다. 후방이 긴 비대칭 차체를
      #    전역 단계에서 다루려면 원형 근사가 아니라 yaw 를 아는 플래너가 필요하다.
      footprint: "[ [0.10, 0.22], [0.10, -0.22], [-0.50, -0.22], [-0.50, 0.22] ]"
      footprint_padding: 0.0
      resolution: 0.05             # slam_toolbox 지도 해상도와 1:1
      track_unknown_space: true
      transform_tolerance: 0.5
      # 🔴 2026-08-09 실측으로 obstacle_layer 를 **제거**했다 (기존:
      #    ["static_layer", "obstacle_layer", "inflation_layer"]).
      #
      #    전역 costmap 이 실시간 /scan 을 정적 지도 위에 덧그리는데, 스캔이 지도와
      #    미세하게 어긋나면 **벽이 이중으로** 찍힌다. 각 벽이 내접반지름(0.22 m)만큼
      #    부풀어 좁은 실내가 통째로 cost 99(INSCRIBED = planner 통과 불가)가 된다.
      #    실측: 정적 지도 occupied 603칸 -> costmap lethal 1099칸 (496칸이 덧그림).
      #    그 결과 로봇이 도달 가능한 영역이 2.04 m² 웅덩이로 쪼개져
      #    "GridBased: failed to create plan" 이 반복됐다.
      #
      #    동적 장애물 회피는 local_costmap 의 obstacle_layer 가 담당한다 —
      #    전역은 정적 지도만 보는 것이 Nav2 표준 구성이다.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 2026-08-08 실측으로 1.0 -> 0.30 (global 은 local 보다 약간 크게 두어
        # 경로가 벽에 붙지 않게 한다). 근거는 local inflation_layer 주석 참고.
        # 🔴 2026-08-09 0.30 -> 0.60. 근거는 local inflation_layer 주석 참고
        #    (외접반지름 0.546 을 넘기는 gradient 확보). local 과 같은 값으로 둔다 —
        #    전역 경로와 지역 궤적이 서로 다른 포텐셜을 보면 DWB 가 전역 경로를
        #    따라가려는 힘과 벽을 피하려는 힘이 어긋난다.
        inflation_radius: 0.60
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: false
    # localization.launch.py의 map 인자가 RewrittenYaml로 덮어씀
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    # Humble 기본 배선에서 behavior는 velocity_smoother를 우회해 /cmd_vel에 직접
    # 발행한다. 2026-08-09부터 nav.launch.py의 SetRemap("cmd_vel","cmd_vel_nav")로
    # smoother 입력단에 합류시켜 우회를 없앴다 — 즉 아래 값은 이제 **1차 리미터**이고
    # velocity_smoother가 2차(최종) 리미터다.
    # ⚠ 그래도 삭제하지 말 것: SetRemap 전제(use_composition=False)가 깨지거나
    #   launch를 우회해 노드를 직접 띄우면 이 값이 유일한 클램프가 된다
    #   (STM32에는 클램프가 없다).
    max_rotational_vel: 1.2
    min_rotational_vel: 0.70   # 2026-08-07 실측 반영: 0.15는 PWM 4로 데드존. 0.70 = PWM 20.5
    rotational_acc_lim: 1.6

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0    # STM32 20Hz 이상 연속 수신 요구
    scale_velocities: False
    feedback: "OPEN_LOOP"        # rf2o 노이즈 + 모터리스 벤치 테스트 고려
    # ⚠ ROS 쪽 유일한 속도 클램프 (STM32 무클램프) — [x, y, theta]
    max_velocity: [0.15, 0.0, 1.2]
    # x 하한: 2026-08-09 0.0 -> -0.10. recovery BackUp 전용으로만 후진을 연다.
    # 0.0이면 behavior_server의 BackUp 음수 vx가 여기서 0으로 clamp되어 카트가
    # 안 움직인다(behavior_server도 SetRemap으로 이 smoother를 통과하므로).
    # -0.10 = BT의 backup_speed 0.10 과 같은 크기 — 그 이상 열지 말 것.
    # ⚠ 정상 주행 후진 금지는 이제 DWB min_vel_x=0.0 하나가 담당한다(2차 방어 소멸).
    min_velocity: [-0.10, 0.0, -1.2]
    max_accel: [0.3, 0.0, 1.6]       # TODO-팀확인 (STM32 램프와 정합)
    max_decel: [-0.3, 0.0, -1.6]
    odom_topic: "/odom_rf2o"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]  # TODO-팀확인: 모터 정지마찰 실측 후
    velocity_timeout: 1.0
