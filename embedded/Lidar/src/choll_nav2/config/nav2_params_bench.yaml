# 쫄래쫄래 카트 Nav2 파라미터 — 모터리스 벤치 검증용 (nav2_params.yaml 파생)
# 차이 2곳: 라이다 정지 상태에서 progress checker abort가 정상 동작이므로 완화
#   - movement_time_allowance: 30.0 -> 600.0
#   - failure_tolerance: 0.3 -> -1.0 (컨트롤러 포기 안 함)
# 실기 주행에서는 반드시 nav2_params.yaml 사용!
#
# 쫄래쫄래 카트 Nav2 파라미터 (ROS2 Humble)
#
# 기반: nav2_bringup 기본 파라미터 구조 + turtlebot3_navigation2(burger) 값 참조.
# 카트 특성 반영: 차동구동, 직사각 footprint(~0.64m 폭), YDLIDAR X4 Pro(~7Hz,
# 0.12~10m, BestEffort QoS — Humble costmap은 기본이 센서 QoS라 추가 설정 불필요),
# 오도메트리는 임시로 rf2o(/odom_rf2o, 10Hz). STM32에는 속도 클램프가 없으므로
# velocity_smoother가 ROS 쪽 유일한 클램프다 — 값 변경 시 주의.
#
# ⚠ TODO-실측/팀확인 표기가 있는 값은 임의 확정 금지 (CLAUDE.md 규칙):
#   - footprint: 골조 실측 후 갱신 (현재 폭 0.64m 추정, base_link=차축 중점 가정)
#   - acc_lim: STM32 램프 4 rad/s²의 기준 축(바퀴/차체) 미확정 → 보수값 사용
#   - inflation_radius / goal tolerance: 서가 통로 폭 확인 후 조정

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0     # X4 Pro 최대 거리
    laser_min_range: 0.12     # X4 Pro 최소 거리
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom_rf2o    # /odom은 향후 STM32 휠 오도메트리용 예약
    bt_loop_duration: 10
    default_server_timeout: 20
    # plugin_lib_names는 Humble 기본값 사용 (표준 BT 노드 전체 포함)
    # 플레이스홀더 — nav.launch.py가 RewrittenYaml로 BackUp 제거 BT
    # (behavior_trees/navigate_to_pose_no_backup.xml) 절대경로를 주입
    default_nav_to_pose_bt_xml: ""

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0     # STM32가 20Hz 이상 연속 수신 요구
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: -1.0
    odom_topic: /odom_rf2o
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3   # 느린 대형 카트 기준 (TB3: 0.5/10s)
      movement_time_allowance: 600.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35    # 북카트 용도상 타이트할 필요 없음. TODO-팀확인
      yaw_goal_tolerance: 0.785  # 45° — 제자리 회전 최소화 (STM32 방향전환 홀드)
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0             # 후진 금지 (후방 미검증 + 방향전환 홀드 회피)
      min_vel_y: 0.0
      max_vel_x: 0.3             # 초기 디레이트 (설계 최대 0.5) TODO-팀확인
      max_vel_y: 0.0
      max_vel_theta: 0.6         # 초기 디레이트 (설계 최대 1.0) TODO-팀확인
      min_speed_xy: 0.0
      max_speed_xy: 0.3
      min_speed_theta: 0.0
      acc_lim_x: 0.3             # TODO-팀확인: STM32 램프 4rad/s² 기준 축 미확정
      acc_lim_y: 0.0
      acc_lim_theta: 0.8         # TODO-팀확인
      decel_lim_x: -0.3
      decel_lim_y: 0.0
      decel_lim_theta: -0.8
      vx_samples: 20
      vy_samples: 0
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5   # rf2o 10Hz TF 지연 대응 (TB3 0.2 → 완화)
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics:
        [
          "RotateToGoal",
          "Oscillation",
          "BaseObstacle",
          "GoalAlign",
          "PathAlign",
          "PathDist",
          "GoalDist",
        ]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.325
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.325
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 4                   # 카트 크기 + 인플레이션이 3m 창에 안 들어감
      height: 4
      resolution: 0.05
      # TODO-실측: 폭 0.64m 추정, base_link=차축 중점 가정. 손잡이 돌출 포함
      # 실측 후 갱신할 것 (전후 비대칭 가능: 예 [[0.50,0.32],...,[-0.15,...]])
      footprint: "[ [0.35, 0.32], [0.35, -0.32], [-0.35, -0.32], [-0.35, 0.32] ]"
      transform_tolerance: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0   # 완만한 기울기 — 좁은 통로에서 경로 확보
        inflation_radius: 0.8      # TODO-팀확인: 서가 통로 폭 기준 조정
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      # TODO-실측 (local_costmap과 동일 값 유지)
      footprint: "[ [0.35, 0.32], [0.35, -0.32], [-0.35, -0.32], [-0.35, 0.32] ]"
      resolution: 0.05             # slam_toolbox 지도 해상도와 1:1
      track_unknown_space: true
      transform_tolerance: 0.5
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.0      # TODO-팀확인
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: false
    # localization.launch.py의 map 인자가 RewrittenYaml로 덮어씀
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    # ⚠ Humble에서 behavior는 velocity_smoother를 우회해 /cmd_vel 직접 발행
    #   → 여기서 자체 클램프 (STM32에 클램프 없음)
    max_rotational_vel: 0.5
    min_rotational_vel: 0.15   # TODO-팀확인: 모터 데드밴드 실측 후 조정
    rotational_acc_lim: 0.8

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0    # STM32 20Hz 이상 연속 수신 요구
    scale_velocities: False
    feedback: "OPEN_LOOP"        # rf2o 노이즈 + 모터리스 벤치 테스트 고려
    # ⚠ ROS 쪽 유일한 속도 클램프 (STM32 무클램프) — [x, y, theta]
    max_velocity: [0.3, 0.0, 0.6]
    min_velocity: [0.0, 0.0, -0.6]   # x 하한 0.0 = 후진 금지
    max_accel: [0.3, 0.0, 0.8]       # TODO-팀확인 (STM32 램프와 정합)
    max_decel: [-0.3, 0.0, -0.8]
    odom_topic: "/odom_rf2o"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]  # TODO-팀확인: 모터 정지마찰 실측 후
    velocity_timeout: 1.0
