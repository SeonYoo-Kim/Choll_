openapi: 3.0.3
info:
  title: Choll Cart API (DRAFT)
  version: 0.1.0
  description: |
    ⚠️ FE 개발용 초안 스펙입니다. 정본은 노션 API 명세서이며,
    BE Swagger(springdoc-openapi)가 준비되면 이 파일을 export 결과물로 교체합니다.
    변경 시 `pnpm api:gen`으로 클라이언트/모킹 코드를 재생성하세요.
servers:
  - url: /
tags:
  - name: carts
  - name: slots
  - name: tasks
  - name: follow
paths:
  /api/carts:
    get:
      tags: [carts]
      operationId: listCarts
      summary: 카트 목록 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CartSummary'
  /api/carts/{cartId}:
    get:
      tags: [carts]
      operationId: getCart
      summary: 카트 상세 조회
      parameters:
        - $ref: '#/components/parameters/CartId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDetail'
  /api/carts/{cartId}/slots:
    get:
      tags: [slots]
      operationId: listSlots
      summary: 카트 슬롯 상태 목록 조회
      parameters:
        - $ref: '#/components/parameters/CartId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
  /api/carts/{cartId}/tasks/progress:
    get:
      tags: [tasks]
      operationId: getTaskProgress
      summary: 정리 작업 진행률 조회
      parameters:
        - $ref: '#/components/parameters/CartId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskProgress'
  /api/carts/{cartId}/commands/call:
    post:
      tags: [carts]
      operationId: callCart
      summary: 카트 호출 (목적지 구역으로 이동)
      parameters:
        - $ref: '#/components/parameters/CartId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zoneId]
              properties:
                zoneId:
                  type: string
                  example: A-3
      responses:
        '202':
          description: 이동 명령 접수
  /api/carts/{cartId}/commands/stop:
    post:
      tags: [carts]
      operationId: stopCart
      summary: 이동 취소(정지)
      parameters:
        - $ref: '#/components/parameters/CartId'
      responses:
        '202':
          description: 정지 명령 접수
  /api/carts/{cartId}/follow/start:
    post:
      tags: [follow]
      operationId: startFollow
      summary: 추종 시작 (선택한 대상)
      parameters:
        - $ref: '#/components/parameters/CartId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId]
              properties:
                targetId:
                  type: integer
                  description: AI가 부여한 추적 대상 Track ID
      responses:
        '202':
          description: 추종 시작 명령 접수
  /api/carts/{cartId}/follow/stop:
    post:
      tags: [follow]
      operationId: stopFollow
      summary: 추종 종료
      parameters:
        - $ref: '#/components/parameters/CartId'
      responses:
        '202':
          description: 추종 종료 명령 접수
components:
  parameters:
    CartId:
      name: cartId
      in: path
      required: true
      schema:
        type: string
      example: cart-001
  schemas:
    CartStatus:
      type: string
      enum: [IDLE, MOVING, FOLLOWING]
    CartSummary:
      type: object
      required: [cartId, name, status]
      properties:
        cartId:
          type: string
          example: cart-001
        name:
          type: string
          example: 1호 카트
        status:
          $ref: '#/components/schemas/CartStatus'
        battery:
          type: integer
          minimum: 0
          maximum: 100
    CartDetail:
      allOf:
        - $ref: '#/components/schemas/CartSummary'
        - type: object
          properties:
            position:
              $ref: '#/components/schemas/CartPosition'
            currentZone:
              type: string
              example: A-3
    CartPosition:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
        y:
          type: number
        theta:
          type: number
          description: 라디안 단위 방향각
    SlotStatus:
      type: string
      enum: [EMPTY, OCCUPIED, RECOGNITION_FAILED]
    Slot:
      type: object
      required: [slotNo, status]
      properties:
        slotNo:
          type: integer
          example: 1
        status:
          $ref: '#/components/schemas/SlotStatus'
        book:
          $ref: '#/components/schemas/Book'
    Book:
      type: object
      required: [bookId, title, zone]
      properties:
        bookId:
          type: string
          example: BK-0042
        title:
          type: string
          example: 어린 왕자
        author:
          type: string
          example: 생텍쥐페리
        zone:
          type: string
          example: 2구역
    TaskProgress:
      type: object
      required: [totalBooks, shelvedBooks, remainingBooks]
      properties:
        totalBooks:
          type: integer
        shelvedBooks:
          type: integer
        remainingBooks:
          type: integer
        currentZoneSlotNos:
          type: array
          items:
            type: integer
          description: 현재 구역에 꽂을 책이 있는 슬롯 번호 목록
