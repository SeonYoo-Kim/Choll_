# 속도 프로파일 오버레이 — nav2 (Nav2 봉투 전체 수용)
#
# ⚠️⚠️ 실기 미검증 프로파일이다. 아래를 모두 확인한 뒤에만 사용할 것:
#      ① `slow`(2.0) 프로파일로 바닥 주행이 정상 확인됨
#      ② 바퀴 최대 RPM·모터 정격이 실측으로 확정됨
#      ③ `wheel_separation_m` 이 실측값으로 교체됨 -> **완료 (2026-08-04, 0.38 m)**
#
# `stm_serial_bridge.yaml` **위에 덮어쓰는** 파일이다:
#
#   ros2 launch stm_serial_bridge stm_serial_bridge.launch.py speed_profile:=nav2
#
# ── 왜 6.4 인가 ─────────────────────────────────────────────────────────────
#
# Nav2 봉투(`max_vel_x=0.3`, `max_vel_theta=0.6`)의 **최악 조합**(직진+최대 회전)이
# 요구하는 바퀴 각속도다. r=0.065, L=0.38(2026-08-04 실측) 기준:
#
#   (0.3 + 0.6 × 0.38/2) / 0.065 = 6.369 rad/s
#
# 이 값 이상이면 Nav2 가 내는 어떤 명령도 `limit_wheel_rad_s()` 에 걸리지 않는다.
# 6.4 는 6.369 를 덮는 가장 단순한 값이다(여유 약 0.5%).
# 계산 근거: `differential_drive.required_max_wheel_rad_s()` + 회귀 테스트.
#
# ⚠️ L 이 0.30 placeholder 였을 때 이 값은 6.0 이었다. 실측 0.38 로 요구량이 6.369 로
#    올라가 6.0 은 **부족**해졌다(최악 조합에서 약 5.8% 축소가 걸린다). L 을 다시 바꾸면
#    이 값도 반드시 재계산할 것.
#
# 참고로 **직진 전속(0.3 m/s)만** 원한다면 4.615 로도 충분하다 — 6.4 는 회전을
# 겹쳤을 때까지 무축소로 통과시키는 값이다. L 이 바뀌어도 직진 요구량 4.615 는 불변이다
# (L 은 회전 성분에만 들어간다).
#
# ── 위험 ────────────────────────────────────────────────────────────────────
#
# - STM32 에는 목표 각속도 상한 clamp 가 없다(`MOTION_CONTROLLER_MAX_WHEEL_RAD_S` 는
#   정의만 되어 있고 미적용). 즉 **이 브리지가 유일한 상한 방어**다.
# - 6.4 rad/s 는 바퀴 원주속도 약 0.42 m/s 에 해당한다. **실기에서 한 번도 낸 적 없는
#   속도**다 — 검증된 최대는 2.0 rad/s(2026-08-04, 바퀴 공중)다.
# - 지금까지 실기는 전부 바퀴 공중 상태였다. 바닥 주행 자체가 미검증이다.
#
# 임의값이 필요하면 이 파일을 고치지 말고 launch 인자를 쓴다:
#   ros2 launch ... stm_serial_bridge.launch.py max_wheel_rad_s:=3.5
stm_serial_bridge:
  ros__parameters:
    max_wheel_rad_s: 6.4
