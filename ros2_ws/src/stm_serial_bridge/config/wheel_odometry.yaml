# wheel_odometry 노드 파라미터.
#
# 실행:
#   ros2 run stm_serial_bridge wheel_odometry_node --ros-args \
#     --params-file install/stm_serial_bridge/share/stm_serial_bridge/config/wheel_odometry.yaml
#
# ⚠️ 노드 이름(`wheel_odometry`)이 키와 일치해야 파라미터가 적용된다.
#    실행 파일 이름은 `wheel_odometry_node` 지만 **노드 이름은 `wheel_odometry`** 다
#    (`stm_serial_bridge_node` 실행 파일의 노드 이름이 `stm_serial_bridge` 인 것과 같은 규칙).
wheel_odometry:
  ros__parameters:
    # --- 차동구동 기하 ---
    # ⚠️ `wheel_radius_m` 은 `config/stm_serial_bridge.yaml`(0.065)과 **의도적으로 다르다.**
    #    아래 "오도메트리 거리 스케일 보정" 참고. `wheel_separation_m` 과
    #    `counts_per_wheel_rev` 는 여전히 두 파일이 **같아야 하며**,
    #    `test_wheel_odometry_node.py` 가 그 일치를 강제한다.
    #
    # === 오도메트리 거리 스케일 보정 (2026-08-08 실기 1m 직진 x3) ===
    #   보고 이동거리 |Δ| : 1.1012 / 1.1136 / 1.1055 m  (실제는 모두 약 1.0 m)
    #   평균 배율 k = 1.1068  → 오도메트리가 약 10.7% 크게 보고했다
    #   보정: 0.065 / 1.1068 = 0.058728  → 채택 0.0587 (잔차 -0.05%)
    #
    # ⚠️ **이 값은 "바퀴 반지름 실측치"가 아니다.** 거리 계산에는 `2*pi*r / counts_per_rev`
    #    라는 **곱만** 들어가므로, 직진 시험만으로는 r 과 counts_per_rev 를 분리할 수 없다.
    #    이 0.0587 은 (실제 유효 구름반지름 + 바퀴 슬립 + counts_per_rev 오차)를 **전부
    #    흡수한 보정 상수**다. 명목 반지름 65mm 대비 9.6% 작은데, 이를 그대로 기구 치수로
    #    읽으면 안 된다 (지름 130mm -> 117.5mm 는 자로 재면 바로 판별된다 — 후속 확인 대상).
    #
    #    참고: r=0.065 를 참으로 두면 이번 데이터가 가리키는 유효 counts/rev 는 약 75,439 로,
    #    손회전 실측 68,160 보다 펌웨어 명목 77,520 쪽에 훨씬 가깝다. 즉 이 10.7% 의 상당 부분이
    #    반지름이 아니라 **미해결 상태인 엔코더 스케일** 문제일 가능성이 있다.
    #    (그래서 브리지의 wheel_radius_m 은 건드리지 않았다 — 아래 파일 주석 참고)
    wheel_radius_m: 0.0587
    wheel_separation_m: 0.38

    # --- 엔코더 스케일 ---
    # 2026-08-08 실측 기준값(좌우 공통).
    # ⚠️ 펌웨어 명목값 77520(= CPR 380 x Gear 51 x Quadrature 4)과 의도적으로 다르다.
    #    그래서 `/stm/wheel_actual_rad_s`(77520 기준, 실제보다 약 12% 작음)는 오도메트리에
    #    쓰지 않는다. 두 스케일을 같은 축에서 비교하면 안 된다.
    counts_per_wheel_rev: 68160.0

    # --- 발행 메시지의 frame ---
    # ⚠️ 이 노드는 **TF 를 발행하지 않는다.** 아래 값은 메시지 라벨일 뿐이며,
    #    odom -> base_link 변환을 실제로 방송하는 것은 이후에 붙일 EKF 다.
    #    이 노드의 출력 `/wheel/odom` 은 그 EKF 의 **입력 하나**이지 최종 오도메트리가 아니다.
    odom_frame_id: odom
    base_frame_id: base_link

    # --- 공분산 (대각 성분의 분산) ---
    # 근거는 wheel_odometry_node.py 모듈 docstring §공분산 (2026-08-08 실기 유도).
    #
    # ⚠️ 스펀지 타이어라 유효 구름반지름이 하중·속도에 따라 변한다. 즉 위 wheel_radius_m
    #    을 아무리 정밀하게 맞춰도 "정확한 상수"는 원리적으로 존재하지 않는다.
    #    그래서 스케일을 더 쫓지 않고, 아래 분산으로 불확실성을 선언해 EKF 가 rf2o 와
    #    가중 평균하도록 맡긴다. 이것이 2026-08-08 에 방향을 바꾼 이유다.
    #
    # 포즈: 적분 오차가 무한히 누적되므로 어떤 상수도 정확할 수 없다. EKF 설정에서
    #       이 포즈는 융합하지 않을 예정이라(속도만 쓴다) 방어적으로 크게 둔다.
    pose_xy_variance: 0.05          # σ ≈ 0.22 m
    pose_yaw_variance: 0.25         # σ ≈ 0.5 rad
    # 속도: vx 만 EKF 가 실제로 융합한다.
    #   거리 스케일 실측 3회 산포 −2.30% / −3.54% / −4.94% + 슬립 전진성분 + dt 지터
    twist_linear_variance: 0.0025   # σ = 0.05 m/s
    #   ⚠️ 크게 둔 것이 **의도**다. 좌측 바퀴 구동 슬립이 전진 4.79% / 후진 11.86%
    #      (밀기 대조는 0.74%) 라서 휠 yaw 는 못 믿는다. 이 값이 커야 융합기가
    #      rf2o 스캔매칭 yaw 를 택한다.
    twist_angular_variance: 0.25    # σ ≈ 0.5 rad/s
